name: Smoke test

# Runs tests/smoke.sh on real Linux, macOS and Windows machines: voice setup, the hooks,
# the online-voice helper, the offline voice and stopping it. mpv plays to a silent
# output (ao=null), since the machines have no sound card, but plays in real time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash  # Git Bash on Windows, where Claude Code runs plugin hooks too
    steps:
      - uses: actions/checkout@v5

      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mpv

      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install mpv

      - name: Install mpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The mpv project's own Windows build, pinned by version and checksum.
          $url = "https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-x86_64-w64-mingw32-full.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\mpv.zip"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\mpv.zip" -Algorithm SHA256).Hash
          if ($hash -ne "c7d4ff6a67dd33659f71d81efa56335fea2213c7522fd67235f3abf0d9ea1dbd") { throw "mpv checksum mismatch: $hash" }
          Expand-Archive "$env:RUNNER_TEMP\mpv.zip" -DestinationPath "$env:RUNNER_TEMP\mpv"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\mpv" -Recurse -Filter mpv.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $exe.DirectoryName

      - name: Send mpv's sound to a silent output
        run: |
          mkdir -p "$RUNNER_TEMP/mpv-config"
          echo "ao=null" > "$RUNNER_TEMP/mpv-config/mpv.conf"
          echo "MPV_HOME=$RUNNER_TEMP/mpv-config" >> "$GITHUB_ENV"

      - name: Line endings stay LF on Windows checkouts
        if: runner.os == 'Windows'
        run: |
          if grep -q $'\r' scripts/run.sh tests/smoke.sh; then
            echo "::error::shell scripts were checked out with CRLF line endings"; exit 1
          fi

      - name: Smoke test
        run: bash tests/smoke.sh
